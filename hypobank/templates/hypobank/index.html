{% load static %}
<!DOCTYPE html>
<html>
    <header class="header">

    <div class="logo">
        <img src="{% static 'images/logo.png' %}" height="40">
        <div>
            <span>Système d'information des hypothèques</span>
        </div>
    </div>

    <div class="actions">

        <div class="search-bar">
            <input type="text" id="search" placeholder="Rechercher par titre..." />
            <button onclick="searchParcelle()">🔍</button>
        </div>

        <a href="{% url 'dashboard' %}" class="btn-dashboard">
            Dashboard
        </a>

        {% if user.is_authenticated %}

    <div class="user-menu">

        <button class="user-menu-button" id="userMenuButton">
            <span class="user-icon">👤</span>
            <span>{{ user.username }}</span>
            <span class="arrow">▼</span>
        </button>

        <div class="user-dropdown" id="userDropdown">

            <a href="#" class="dropdown-item">
                👤 Mon profil
            </a>

            <a href="{% url 'logout' %}" class="dropdown-item logout-item">
                🚪 Déconnexion
            </a>

        </div>

    </div>

{% else %}

    <a href="{% url 'login' %}" class="btn-login">
        Connexion
    </a>

{% endif %}

    </div>

</header>
<head>
    <title>Carte des parcelles</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>


<div id="map"></div>

<!-- Stocker le GeoJSON proprement -->
<script id="parcelles-data" type="application/json">
    {{ parcelles_geojson|safe }}
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- TON JS EXTERNE -->
<script src="{% static 'js/scripts.js' %}"></script>

</body>
</html>
